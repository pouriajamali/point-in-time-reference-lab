name: Native point-in-time reference packages and temporal faults
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_release:
        description: Verify aggregation and attestations without creating a release
        type: boolean
        default: false
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python .github/ci/policy.py gate
      - name: Import exact reviewed sealed maintainer linter
        run: python tools/build_actionlint.py prepare-ci-sealed --target windows-amd64
      - name: Check actual workflow syntax and expressions
        run: python .github/ci/policy.py lint
  verify:
    name: verify-${{ matrix.rid }}
    permissions:
      contents: read
      actions: read
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Own supported host, control, SDK and original product matrix
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $python = if ($IsWindows) { Join-Path $env:RUNNER_TOOL_CACHE 'Python/3.12.10/x64/python.exe' } else { '/usr/bin/python3' }
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'HOLD: existing Python 3.12 required; no download' }
          & $python -I -S -B tools/ci05/ci_route05.py --rid '${{ matrix.rid }}' --phase verify-product
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: bundle-${{ matrix.rid }}
          path: artifacts/delivery/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: proof-${{ matrix.rid }}
          path: |
            artifacts/ci-route/**/*.json
            artifacts/unit.xml
            artifacts/package-checks.json
            artifacts/dependency-advisories.json
            artifacts/verifier-tests/receipt.json
            artifacts/build/archive.json
            artifacts/integration/receipt.json
            artifacts/wire-history/receipt.json
            artifacts/knowledge-boundary/receipt.json
          if-no-files-found: error
  aggregate:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.verify_release == true
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: v0.1.0-preview.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: artifacts/release
      - name: Verify executed native archives and exact Git source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python tools/check_release.py --directory artifacts/release --commit "$SOURCE_SHA" --tag "$RELEASE_TAG"
      - name: Attest exact archive digests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/release/SHA256SUMS.txt
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: verified-release-candidate
          path: artifacts/release/*
          if-no-files-found: error
      - name: Prepare private draft for known-key signing gate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUAL_TAG: ${{ github.ref_name }}
        run: |
          test "$ACTUAL_TAG" = "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --draft --prerelease --title "$RELEASE_TAG — Point-in-Time Instrument Reference Lab" --notes-file docs/RELEASE.md
